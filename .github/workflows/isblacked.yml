# Checks if the code is formatted with Black.

name: is your code linted with black?

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Is code blacked
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/isblacked.yml

      - name: Install Black
        run: python -m pip install --disable-pip-version-check black==26.5.1

      - name: Check formatting
        run: python -m black . --extend-exclude "^/external/" --check --line-length 120 --target-version py310
