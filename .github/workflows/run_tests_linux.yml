name: Run the Linux tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: linux-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3, 4, 5, 6]
    name: Tests on ${{ matrix.os }}-shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: ${{ matrix.shard == 1 && 'recursive' || 'false' }}

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: bioptim
          environment-file: environment.yml
          conda-remove-defaults: true
          channel-priority: strict

      - name: Print conda info
        if: matrix.shard == 1
        run: |
          conda info
          conda list

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-cov pytest-mpl packaging

      - name: Install ACADOS on Linux
        if: matrix.shard == 1
        working-directory: external
        run: |
          sudo apt-get install -y --no-install-recommends librhash-dev
          ./acados_install_linux.sh 4 "$CONDA_PREFIX"

      - name: Test installed version of bioptim
        if: matrix.shard == 1
        run: |
          python -m pip install .
          cd
          python -c "import bioptim"

      - name: Run tests with code coverage
        run: python -m pytest -v --color=yes --durations=20 --durations-min=1.0 --cov-report term-missing --cov=bioptim tests/shard${{ matrix.shard }} --mpl-baseline-path=tests/plot_reference_images

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true

  merge-coverage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/run_tests_linux.yml

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*

      - name: Rename coverage files
        run: |
          for shard in {1,2,3,4,5,6}; do
            mv coverage-${shard}/.coverage .coverage${shard}
          done

      - name: Merge coverage reports
        run: coverage combine .coverage1 .coverage2 .coverage3 .coverage4 .coverage5 .coverage6

      - name: Generate XML report
        run: |
          coverage xml
          coverage report -m

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
