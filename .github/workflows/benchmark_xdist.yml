name: Benchmark pytest workers

on:
  push:
    branches: [codex/ci-xdist-tests]
    paths:
      - '.github/workflows/benchmark_xdist.yml'
      - '.github/ci/benchmark_xdist.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare pytest workers on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -l {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: bioptim
          environment-file: environment.yml
      - name: Install benchmark and CI tools
        run: conda install --yes "numpy>=2.4,<3" pip pytest pytest-cov "pytest-xdist>=3.8,<4" psutil packaging -c conda-forge
      - name: Compare serial and parallel runs
        run: >-
          python .github/ci/benchmark_xdist.py
          --output benchmark-results
          --shards 3,4,5,6
          ${{ runner.os == 'Linux' && '--coverage' || '' }}
      - name: Upload paired measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-workers-${{ runner.os }}
          path: benchmark-results
          if-no-files-found: error
          include-hidden-files: true
