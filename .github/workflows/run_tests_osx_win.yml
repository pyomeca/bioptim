name: Tests (macOS and Windows)

on:
  pull_request:
    types: [review_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2, 3, 4, 5, 6]
    name: Tests on ${{ matrix.os }}-shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: ${{ matrix.shard == 1 && 'recursive' || 'false' }}

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: bioptim
          environment-file: environment.yml
          conda-remove-defaults: true
          channel-priority: strict

      - name: Print conda info
        if: matrix.shard == 1
        run: |
          conda info
          conda list

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-cov packaging

      - name: Install ACADOS on Mac
        if: matrix.os == 'macos-latest' && matrix.shard == 1
        working-directory: external
        run: ./acados_install_mac.sh 4 "$CONDA_PREFIX"

      - name: Test installed version of bioptim
        if: matrix.shard == 1
        run: |
          python -m pip install .
          cd
          python -c "import bioptim"

      - name: Run tests without code coverage
        run: python -m pytest -v --color=yes --durations=20 --durations-min=1.0 tests/shard${{ matrix.shard }}
