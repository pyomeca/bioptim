name: Run the Multiplatform tests

on:
  pull_request:
    types: [auto_merge_enabled]

concurrency:
  group: multiplatform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: macos-latest
            conda-platform: osx-arm64
          - os: windows-latest
            conda-platform: win-64
        shard: [1, 2, 3, 4, 5, 6]
    name: Tests on ${{ matrix.target.os }}-shard ${{ matrix.shard }}
    runs-on: ${{ matrix.target.os }}
    env:
      # Shard 1 shares Acados output files; shard 2 shares performance measurements.
      PYTEST_WORKERS: ${{ contains(fromJSON('[3,4,5,6]'), matrix.shard) && '2' || '0' }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CONDA_LOCKFILE: .github/conda-lock/conda-${{ matrix.target.conda-platform }}.lock

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: ${{ matrix.shard == 1 && 'recursive' || 'false' }}

      - name: Verify Conda lockfiles
        run: python .github/conda-lock/check_lockfiles.py

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: bioptim
          conda-remove-defaults: true
          channel-priority: strict

      - name: Get cache refresh period
        id: cache-period
        run: echo "week=$(date -u '+%G-W%V')" >> "$GITHUB_OUTPUT"

      - name: Restore Conda environment
        id: conda-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CONDA }}/envs/bioptim
          key: conda-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(env.CONDA_LOCKFILE) }}-${{ steps.cache-period.outputs.week }}
          restore-keys: |
            conda-env-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(env.CONDA_LOCKFILE) }}-

      - name: Install locked Conda environment
        if: steps.conda-cache.outputs.cache-hit != 'true'
        run: conda install --name bioptim --file "$CONDA_LOCKFILE" --yes

      - name: Print conda info
        if: matrix.shard == 1
        run: |
          conda info
          conda list

      - name: Install ACADOS on Mac
        if: matrix.target.os == 'macos-latest' && matrix.shard == 1
        working-directory: external
        run: ./acados_install_mac.sh 4 "$CONDA_PREFIX"

      - name: Test installed version of bioptim
        if: matrix.shard == 1
        run: |
          python -m pip install .
          cd
          python -c "import bioptim"

      - name: Run tests without code coverage
        run: pytest -n "$PYTEST_WORKERS" --dist=worksteal --max-worker-restart=0 -v --color=yes --durations=20 --durations-min=1.0 tests/shard${{ matrix.shard }}
